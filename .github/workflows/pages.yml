name: Deploy Wildrange to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-manual
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload browser game
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: wildrange-pages-${{ github.run_attempt }}
      - name: Allow artifact metadata to settle
        run: sleep 5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: wildrange-pages-${{ github.run_attempt }}
