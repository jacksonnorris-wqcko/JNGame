name: Validate Wildrange solo build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client JavaScript syntax
        run: node --check public/game.js
      - name: Verify browser files and controls
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const html = fs.readFileSync("public/index.html", "utf8");
            for (const item of ["./styles.css", "./game.js", "./favicon.svg"]) {
              const path = "public/" + item.replace("./", "");
              if (!fs.existsSync(path)) throw new Error("Missing " + path);
            }
            for (const id of ["render-canvas", "start-button", "continue-button", "interaction-prompt", "health-fill", "ammo-current", "contract-progress"]) {
              if (!html.includes(id)) throw new Error("Missing UI reference " + id);
            }
            console.log("Browser file validation passed.");
          '
