name: Validate Wildrange solo build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client JavaScript syntax
        run: node --check public/game.js
      - name: Verify browser files and controls
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const html = fs.readFileSync("public/index.html", "utf8");
            const js = fs.readFileSync("public/game.js", "utf8");
            const css = fs.readFileSync("public/styles.css", "utf8");
            const playHtml = fs.readFileSync("public/play.html", "utf8");
            for (const file of ["public/index.html", "public/styles.css", "public/game.js", "public/favicon.svg"]) {
              if (!fs.existsSync(file)) throw new Error("Missing " + file);
            }
            for (const id of ["render-canvas", "start-button", "continue-button", "interaction-prompt", "health-fill", "ammo-current", "contract-progress", "map-close-button"]) {
              if (!html.includes(id)) throw new Error("Missing UI reference " + id);
            }
            for (const feature of ["makePbrSurface", "makeFoliageMaterial", "createSkyDome", "createDistantRidgeBands", "createCabin", "createGroundCover", "setupPostProcessing", "animateWorld", "createFurTexture", "createWeapon", "getAnimalModelContainer", "attachAnimalModel", "setAnimalAnimation", "createDeer", "createBoar", "adjustScopeZoom", "updateCabinDoor", "updateContractBoard", "makeReadableSignMaterial", "walkSurfaceAt", "isPinecrestCompoundClearance", "buildPinecrestCompoundAccess", "bearingName"]) {
              if (!js.includes("function " + feature + "(")) throw new Error("Missing graphics system " + feature);
            }
            for (const cssRule of [".quick-actions", ".hud-panel"]) {
              if (!css.includes(cssRule)) throw new Error("Missing interface styling " + cssRule);
            }
            for (const [name, page] of [["index.html", html], ["play.html", playHtml]]) {
              const coreLoader = page.indexOf("https://cdn.babylonjs.com/babylon.js");
              const gltfLoader = page.indexOf("https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js");
              const gameAsset = /game\.js\?v=([0-9.]+)/.exec(page);
              const styleAsset = /styles\.css\?v=([0-9.]+)/.exec(page);
              const gameScript = gameAsset ? page.indexOf(gameAsset[0]) : -1;
              if (!gameAsset || !styleAsset || gameAsset[1] !== styleAsset[1] || gameScript < 0) {
                throw new Error(name + " graphics build asset version mismatch");
              }
              if (coreLoader < 0 || gltfLoader <= coreLoader || gameScript <= gltfLoader) {
                throw new Error(name + " must load Babylon glTF/GLB loader after core and before game.js");
              }
            }
            if (!js.includes("board-paper-front") || !js.includes("board-paper-back")) throw new Error("Pinecrest noticeboard must show readable text on both faces");
            if (!js.includes("Pinecrest gate nameplate") || !js.includes("Pinecrest outpost access road")) throw new Error("Outpost gate sign or access road is missing");
            if (!js.includes("Pinecrest lodge sign face") || !js.includes("Outfitters fascia sign face") || !js.includes("Harvest station sign face")) throw new Error("One or more finished compound signs are missing");
            if (!js.includes("material.emissiveTexture = texture") || !js.includes("material.backFaceCulling = false") || !js.includes("material.zOffset = -4")) throw new Error("Readable sign material must be emissive, double-sided and depth-biased");
            if (!js.includes("const scaleX = size.width / 768") || !js.includes("ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0)")) throw new Error("Mission board text must fill the full dynamic texture");
            if (!js.includes("Outfitter stitched canvas") || !js.includes("window shutter vertical slat") || !js.includes("compound fence steel rail bracket")) throw new Error("Compound material and joinery finish is missing");
            if (!js.includes("contractBoardMesh = box(\"contract-board\"") || !js.includes("new BABYLON.Vector3(-21.8, boardGround + 1.72, 33.0)")) throw new Error("Contract board is not located inside the compound");
            if (!js.includes("if (!Number.isFinite(degrees)) return \"N\"")) throw new Error("Compass must guard invalid bearing values");
            if (!js.includes("solid lodge entry stair") || !js.includes("compound north fence lower rail")) throw new Error("Lodge stairs or compound perimeter is missing");
            if (js.includes("new BABYLON.Vector3(-11.8, 1.49, 27.5)")) throw new Error("Old counter table remains behind the noticeboard");
            if (!js.includes("localX >= -13.25 && localX <= -6.25") || !js.includes("localX >= 6.25 && localX <= 13.25")) throw new Error("South fence collision must match the visible fence sections");
            if (!html.includes("scope-overlay") || !css.includes("#game-shell.aiming .scope-overlay")) throw new Error("Scope sight picture UI is missing");
            if (!html.includes("touch-jump") || !html.includes("SPACE")) throw new Error("Jump controls are missing");
            const requiredAssets = [
              "public/assets/nature_reserve_forest_1k.hdr",
              "public/assets/pbr/grass/grass_albedo.jpg",
              "public/assets/pbr/grass/grass_normal.jpg",
              "public/assets/pbr/grass/grass_roughness.jpg",
              "public/assets/pbr/forest_floor/forest_floor_albedo.jpg",
              "public/assets/pbr/forest_floor/forest_floor_normal.jpg",
              "public/assets/pbr/wood_siding/wood_siding_albedo.jpg",
              "public/assets/pbr/wood_planks/wood_planks_albedo.jpg",
              "public/assets/pbr/wood_planks/wood_planks_normal.jpg",
              "public/assets/pbr/bark/bark_albedo.jpg",
              "public/assets/pbr/rock/rock_albedo.jpg",
              "public/assets/animals/deer-base.glb",
              "public/assets/animals/pig-base.glb",
              "public/assets/weapons/bolt-action-rifle.glb",
              "public/assets/models/ATTRIBUTION.md",
              "public/assets/asset-manifest.json"
            ];
            for (const file of requiredAssets) {
              if (!fs.existsSync(file)) throw new Error("Missing imported graphics asset " + file);
            }
            const manifest = JSON.parse(fs.readFileSync("public/assets/asset-manifest.json", "utf8"));
            const models = new Map((manifest.assets || []).filter((asset) => asset.path).map((asset) => [asset.path, asset]));
            const modelChecks = [
              { path: "animals/deer-base.glb", minBytes: 100000, meshes: 1, skins: 1, nodes: ["Head", "Neck", "LeftFrontUpLeg", "RightHindUpLeg"], clips: ["Idle", "Walk", "Run"] },
              { path: "animals/pig-base.glb", minBytes: 100000, meshes: 1, skins: 1, nodes: ["Head", "Jaw", "LeftFrontUpLeg", "RightHindUpLeg"], clips: ["Idle", "Walk", "Run"] },
              { path: "weapons/bolt-action-rifle.glb", minBytes: 50000, meshes: 2, skins: 0, nodes: ["bolt", "rifle-body"], clips: [] }
            ];
            if (fs.existsSync("public/assets/weapons/marksman-rifle.glb")) {
              modelChecks.push({ path: "weapons/marksman-rifle.glb", minBytes: 100000, minMeshes: 1, skins: 0, nodes: [], clips: ["magazine-open", "magazine-close", "bolt-open", "bolt-close"] });
            }
            // The jointed CC0 boar is staged for rig inspection before it replaces the animated boar.
            if (fs.existsSync("public/assets/animals/forest-boar.glb")) {
              modelChecks.push({ path: "animals/forest-boar.glb", minBytes: 100000, minMeshes: 1, skins: 0, nodes: [], clips: [] });
            }
            // High-detail CC0 deer mesh is a retopology/rigging source, not a runtime animal yet.
            if (fs.existsSync("public/assets/animals/deer-high-detail-source.glb")) {
              modelChecks.push({ path: "animals/deer-high-detail-source.glb", minBytes: 1000000, minMeshes: 1, skins: 0, nodes: [], clips: [] });
            }
            for (const model of modelChecks) {
              const record = models.get(model.path);
              const file = "public/assets/" + model.path;
              const bytes = fs.readFileSync(file);
              if (!record || record.bytes !== bytes.length || bytes.length < model.minBytes || bytes.subarray(0, 4).toString("ascii") !== "glTF") {
                throw new Error("Invalid or unmanifested GLB asset: " + model.path);
              }
              const validMeshCount = model.minMeshes ? record.mesh_count >= model.minMeshes : record.mesh_count === model.meshes;
              if (!record.license || !record.source || !validMeshCount || record.skin_count !== model.skins) {
                throw new Error("Missing licence, source or geometry metadata for " + model.path);
              }
              for (const name of model.nodes) {
                if (!(record.node_names || []).includes(name)) throw new Error("Missing named node " + name + " in " + model.path);
              }
              for (const clip of model.clips) {
                if (!(record.animation_names || []).includes(clip)) throw new Error("Missing animation " + clip + " in " + model.path);
              }
            }
            console.log("Wildrange browser build validation passed.");
          '

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start the static game server
        run: |
          mkdir -p artifacts
          python3 -m http.server 8000 --directory public > /tmp/wildrange-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/play.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wildrange-http.log
          exit 1
      - name: Open Wildrange in headless Chrome
        run: node scripts/browser_smoke_test.mjs
