name: Validate Wildrange solo build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client JavaScript syntax
        run: node --check public/game.js
      - name: Verify browser files and controls
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const html = fs.readFileSync("public/index.html", "utf8");
            const js = fs.readFileSync("public/game.js", "utf8");
            const css = fs.readFileSync("public/styles.css", "utf8");
            for (const file of ["public/index.html", "public/styles.css", "public/game.js", "public/favicon.svg"]) {
              if (!fs.existsSync(file)) throw new Error("Missing " + file);
            }
            for (const id of ["render-canvas", "start-button", "continue-button", "interaction-prompt", "health-fill", "ammo-current", "contract-progress", "map-close-button"]) {
              if (!html.includes(id)) throw new Error("Missing UI reference " + id);
            }
            for (const feature of ["makePbrSurface", "makeFoliageMaterial", "createSkyDome", "createDistantRidgeBands", "createCabin", "createGroundCover", "setupPostProcessing", "animateWorld", "createFurTexture", "createWeapon", "createWildlifeLeg", "createDeer", "createBoar", "adjustScopeZoom"]) {
              if (!js.includes("function " + feature + "(")) throw new Error("Missing graphics system " + feature);
            }
            for (const cssRule of [".quick-actions", ".hud-panel"]) {
              if (!css.includes(cssRule)) throw new Error("Missing interface styling " + cssRule);
            }
            if (!html.includes("styles.css?v=0.6.0") || !html.includes("game.js?v=0.6.0")) {
              throw new Error("Graphics build asset version mismatch");
            }
            if (!html.includes("scope-overlay") || !css.includes("#game-shell.aiming .scope-overlay")) throw new Error("Scope sight picture UI is missing");
            const requiredAssets = [
              "public/assets/nature_reserve_forest_1k.hdr",
              "public/assets/pbr/grass/grass_albedo.jpg",
              "public/assets/pbr/grass/grass_normal.jpg",
              "public/assets/pbr/grass/grass_roughness.jpg",
              "public/assets/pbr/forest_floor/forest_floor_albedo.jpg",
              "public/assets/pbr/forest_floor/forest_floor_normal.jpg",
              "public/assets/pbr/wood_siding/wood_siding_albedo.jpg",
              "public/assets/pbr/wood_planks/wood_planks_albedo.jpg",
              "public/assets/pbr/wood_planks/wood_planks_normal.jpg",
              "public/assets/pbr/bark/bark_albedo.jpg",
              "public/assets/pbr/rock/rock_albedo.jpg",
              "public/assets/asset-manifest.json"
            ];
            for (const file of requiredAssets) {
              if (!fs.existsSync(file)) throw new Error("Missing imported graphics asset " + file);
            }
            console.log("Wildrange browser build validation passed.");
          '

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start the static game server
        run: |
          mkdir -p artifacts
          python3 -m http.server 8000 --directory public > /tmp/wildrange-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/play.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wildrange-http.log
          exit 1
      - name: Open Wildrange in headless Chrome
        run: node scripts/browser_smoke_test.mjs
