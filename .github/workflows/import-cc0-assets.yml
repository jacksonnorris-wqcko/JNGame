name: Import CC0 graphics assets

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/import_cc0_assets.py"
      - ".github/workflows/import-cc0-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wildrange-asset-import
  cancel-in-progress: false

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Wildrange
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import CC0 PBR textures and forest HDRI
        run: python scripts/import_cc0_assets.py
      - name: Save downloaded assets into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if ! git diff --cached --quiet; then
            git commit -m "Add locally hosted CC0 Wildrange environment assets"
            git push origin HEAD:main
          else
            echo "CC0 assets already present; no asset commit needed."
          fi
